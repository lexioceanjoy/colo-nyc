name: Visual baselines
# Renders new visual baselines on Linux (the only platform they're compared on) and uploads them as an artifact.
# Nothing is committed here: a person or agent downloads them, reviews the image diff in the PR, and commits.
# That commit is the approval. See CLAUDE.md "Visual baselines".
#   Trigger: add the `visual:update` label to a PR (or run manually on a branch once this file is on main).
#   Then:    gh run download <run-id> -n visual-baselines -D tests/e2e/__screenshots__
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'visual:update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/visual.spec.ts --project=desktop --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
          retention-days: 14
