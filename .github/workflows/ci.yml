name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # validate skips the coordinate check (with a warning) when Supabase env is absent, e.g. on forks.
      - run: pnpm validate
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: pnpm exec next build
      - run: pnpm exec playwright install --with-deps chromium
      # Includes the reachability gate (every control reachable by pointer and keyboard at 390/768/1024/1280/1440,
      # EN + 中文) and visual regression against tests/e2e/__screenshots__.
      - run: pnpm e2e
      - name: Upload e2e results (screenshot diffs, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14
      # Social flow + RLS checks against the Supabase TEST project (skipped until the test secrets exist).
      - name: Social E2E (test project)
        if: ${{ env.SUPABASE_TEST_URL != '' }}
        run: pnpm e2e:social
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
