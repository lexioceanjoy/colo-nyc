name: Refresh Google coordinates
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: fetch
        run: pnpm data:fetch
      # Fold crowd-confirmed details (2+ people agree) into spots.json.
      - id: crowd
        run: pnpm data:crowd
      - run: pnpm validate
      # A closure flag or crowd detail changed: open a PR instead of pushing (SPEC §5.4).
      - if: steps.fetch.outputs.closed_changed == 'true' || steps.crowd.outputs.crowd_changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/closures
          commit-message: "data: weekly refresh (closures and crowd-confirmed details)"
          title: "Weekly refresh: closures or crowd-confirmed details changed"
          body-path: .fetch-places-summary.txt
          add-paths: |
            src/data/spots.json
            data/closures.log
      # Pushes from GITHUB_TOKEN don't trigger deploys, so ping the Vercel deploy hook (ISR picks up fresh coordinates).
      - name: Redeploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "deploy hook called"; else echo "no deploy hook yet (M2)"; fi
      # Phase 2: no AI here. Just tell Lexi (via one GitHub issue) when accepted suggestions are waiting for intake.
      - id: intake
        run: pnpm exec tsx scripts/intake-issue.ts
      - name: Open or update the intake issue
        if: steps.intake.outputs.waiting != '' && steps.intake.outputs.waiting != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          WAITING: ${{ steps.intake.outputs.waiting }}
        run: |
          title="$WAITING accepted suggestions waiting for intake"
          num=$(gh issue list --state open --label intake --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh label create intake --color 2A44C9 --description "Accepted spot suggestions waiting for pnpm data:intake" 2>/dev/null || true
            gh issue create --title "$title" --body-file .intake-issue.md --label intake
          else
            gh issue edit "$num" --title "$title" --body-file .intake-issue.md
          fi
